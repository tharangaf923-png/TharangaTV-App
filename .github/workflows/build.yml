name: Build TharangaTV APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Build APK with Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          mkdir myapp
          cd myapp
          bubblewrap init --manifest https://tharangaf923-png.github.io/Tharangatv/manifest.json
          bubblewrap build
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TharangaTV-APK
          path: myapp/app/build/outputs/bundle/release/*.aab
